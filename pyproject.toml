[project]
name = "rag-service"
version = "0.1.0"
description = "Advanced RAG Service with LlamaIndex"
requires-python = ">=3.11"
dependencies = [
    # LlamaIndex core
    "llama-index-core>=0.12.0",
    "llama-index-llms-groq>=0.3.0",
    "llama-index-llms-ollama>=0.5.0",
    "llama-index-embeddings-huggingface>=0.5.0",
    "sentence-transformers>=3.0.0",
    # Vector store
    "llama-index-vector-stores-qdrant>=0.4.0",
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    # Document readers
    "llama-index-readers-file>=0.4.0",
    "llama-index-readers-web>=0.3.0",
    "llama-index-readers-database>=0.3.0",
    "pymupdf>=1.25.0",
    "docx2txt>=0.8",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "fastapi-mcp>=0.3.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.18",
    # Reranking
    "llama-index-postprocessor-flag-embedding-reranker>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "core", "config", "evaluation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
